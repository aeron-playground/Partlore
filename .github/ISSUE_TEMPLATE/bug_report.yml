name: Bug report
description: Something in the app doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Don't file it here. Follow SECURITY.md. Never share keys or passwords."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 9, Android 17
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
