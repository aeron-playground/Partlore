name: Feature request
description: Suggest a new feature or a new part to cover.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do at the bench, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Partlore help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you use today
      description: Other apps, websites or datasheets you use for this.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and discussions.
          required: true
