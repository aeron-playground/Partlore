name: Setup
description: JDK 21 and Gradle with dependency caching.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    # Also validates gradle-wrapper.jar against Gradle's published checksums.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Open-source cache provider. The default one is proprietary.
        cache-provider: basic
