name: Setup
description: JDK 21 and Gradle with dependency caching.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "21"

    # Also validates gradle-wrapper.jar against Gradle's published checksums.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Open-source cache provider. The default one is proprietary.
        cache-provider: basic
