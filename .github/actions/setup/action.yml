name: Setup
description: JDK 21 and Gradle with dependency caching.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    # Also validates gradle-wrapper.jar against Gradle's published checksums.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # Open-source cache provider. The default one is proprietary.
        cache-provider: basic
