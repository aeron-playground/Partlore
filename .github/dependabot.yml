version: 2
updates:
  # Gradle: the version catalog, plugins and the wrapper.
  # Stays on stable releases while we are on stable (see ADR 0005).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
