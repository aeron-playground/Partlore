area:app:
  - changed-files:
      - any-glob-to-any-file: ["app/**", "feature/**", "core/**"]

area:design:
  - changed-files:
      - any-glob-to-any-file: ["core/designsystem/**"]

area:content:
  - changed-files:
      - any-glob-to-any-file: ["content/**"]

area:tools:
  - changed-files:
      - any-glob-to-any-file: ["tools/**", "scripts/**"]

area:ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".githooks/**"]

area:build:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.gradle.kts"
          - "gradle/**"
          - "gradle.properties"
          - "gradlew"
          - "gradlew.bat"
          - "config/**"
          - ".editorconfig"

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["gradle/libs.versions.toml"]

area:docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md"]

area:planner:
  - changed-files:
      - any-glob-to-any-file: ["core/planner/**", "feature/planner/**"]

area:ocr:
  - changed-files:
      - any-glob-to-any-file: ["core/ocr/**", "feature/scanner/**"]
