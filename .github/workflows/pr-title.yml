name: PR title

on:
  pull_request:
    branches: [main]
    # synchronize: required checks must report on every new head commit.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The title arrives through env, never inside the script text.
      - run: scripts/check-commit-msg.sh title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MAX_LENGTH: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '120' || '72' }}
