pins:
  # J1, left edge, from the antenna end. The board prints 2, 3, 0, 1, 10 where the guide writes IO2 and so on.
  - { table: J1, no: 1, safe: ok }
  - { table: J1, no: 2, safe: caution, voltage: 3.3, note: "The board's 3.3 V rail. Can power the board, but use one power source at a time: the Micro-USB port, the 5V pins or the 3V3 pins.", cites: [ { source: s2, section: Power Supply Options }, { source: s6, page: 2 } ] }
  - { table: J1, no: 3, safe: caution, voltage: 3.3, note: "The board's 3.3 V rail. Can power the board, but use one power source at a time: the Micro-USB port, the 5V pins or the 3V3 pins.", cites: [ { source: s2, section: Power Supply Options }, { source: s6, page: 2 } ] }
  - { table: J1, no: 4, safe: caution, board_label: "2", voltage: 3.3, five_v_tolerant: false, strapping: { role: boot-mode, must_be: high, at: reset }, note: "Keep it high at reset. It doesn't choose the boot mode, but the datasheet asks for a pull-up against glitches; the chip leaves it floating.", cites: [ { source: s3, page: 30 }, { source: s3, page: 31 }, { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 5, safe: ok, board_label: "3", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 6, safe: ok }
  - { table: J1, no: 7, safe: caution, voltage: 3.3, five_v_tolerant: false, note: "Low restarts the chip; the Reset button pulls it low.", cites: [ { source: s2, section: Description of Components }, { source: s6, page: 2 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 8, safe: ok }
  - { table: J1, no: 9, safe: ok, board_label: "0", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 10, safe: ok, board_label: "1", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 11, safe: ok, board_label: "10", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J1, no: 12, safe: ok }
  - { table: J1, no: 13, safe: caution, voltage: 5, note: "Can power the board, but use one power source at a time: the Micro-USB port, the 5V pins or the 3V3 pins.", cites: [ { source: s2, section: Power Supply Options }, { source: s6, page: 2 } ] }
  - { table: J1, no: 14, safe: caution, voltage: 5, note: "Can power the board, but use one power source at a time: the Micro-USB port, the 5V pins or the 3V3 pins.", cites: [ { source: s2, section: Power Supply Options }, { source: s6, page: 2 } ] }
  - { table: J1, no: 15, safe: ok }
  # J3, right edge, from the antenna end.
  - { table: J3, no: 1, safe: ok }
  - { table: J3, no: 2, safe: caution, voltage: 3.3, five_v_tolerant: false, note: "UART0 TX, wired to the board's CP2102N USB-to-UART chip, which uploads firmware and shows the serial console.", cites: [ { source: s3, page: 23 }, { source: s6, page: 2 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 3, safe: caution, voltage: 3.3, five_v_tolerant: false, note: "UART0 RX, wired to the board's CP2102N USB-to-UART chip, which uploads firmware and shows the serial console.", cites: [ { source: s3, page: 23 }, { source: s6, page: 2 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 4, safe: ok }
  - { table: J3, no: 5, safe: caution, board_label: "9", voltage: 3.3, five_v_tolerant: false, strapping: { role: boot-mode, must_be: high, at: reset }, note: "Read at reset: high (the default, pulled up inside the chip) runs the program in flash; low, with GPIO8 high, starts download mode. The Boot button pulls it low.", cites: [ { source: s3, page: 30 }, { source: s3, page: 31 }, { source: s6, page: 2 }, { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 6, safe: caution, board_label: "8", voltage: 3.3, five_v_tolerant: false, strapping: { role: boot-mode, at: reset }, note: "Read at reset with GPIO9: it must be high for download mode; any level runs the program in flash. It also drives the board's RGB LED, and can turn off boot messages on UART0 when the chip's eFuses ask for it.", cites: [ { source: s3, page: 31 }, { source: s3, page: 32 }, { source: s2, section: Description of Components }, { source: s6, page: 2 }, { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 7, safe: ok }
  - { table: J3, no: 8, safe: ok, board_label: "7", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 9, safe: ok, board_label: "6", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 10, safe: ok, board_label: "5", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 11, safe: ok, board_label: "4", voltage: 3.3, five_v_tolerant: false, cites: [ { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 12, safe: ok }
  - { table: J3, no: 13, safe: ok, board_label: "18", voltage: 3.3, five_v_tolerant: false, note: "The chip's USB D- pin. On this board it isn't wired to the USB port (that link is not fitted).", cites: [ { source: s3, page: 23 }, { source: s6, page: 2 }, { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 14, safe: caution, board_label: "19", voltage: 3.3, five_v_tolerant: false, note: "The chip's USB D+ pin, with its USB pull-up on at reset. On this board it isn't wired to the USB port (that link is not fitted).", cites: [ { source: s3, page: 17 }, { source: s3, page: 23 }, { source: s6, page: 2 }, { source: s5, page: 1 }, { source: s4, page: 21 } ] }
  - { table: J3, no: 15, safe: ok }
