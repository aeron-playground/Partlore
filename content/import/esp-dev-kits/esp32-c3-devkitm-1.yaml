# Hints for tools:importer: what the ESP32-C3-DevKitM-1 user guide's pin tables don't say.
# The importer adds s1 (esp-dev-kits) and s2 (the guide). Every value here cites its own source.
part:
  id: espressif/esp32-c3-devkitm-1
  name: ESP32-C3-DevKitM-1
  manufacturer: Espressif
  category: esp32-boards
  tags: [wifi, bluetooth, 3v3-logic, micro-usb]
  summary: Espressif's small ESP32-C3 dev board with an ESP32-C3-MINI-1 or MINI-1U module, a Micro-USB port with a USB-to-UART chip, and an RGB LED on GPIO8.
