  - { table: J3, no: 3, safe: caution, voltage: 3.3, five_v_tolerant: false, note: "UART0 RX, wired to the board's CP2102N USB-to-UART chip, which uploads firmware and shows the serial console.", cites: [ { source: s3, page: 26 }, { source: s6, page: 2 }, { source: s4, page: 27 } ] }
