# yaml-language-server: $schema=../../../schema/pins.schema.json
status:
  level: checked
  checked_by: [aeron-gh]
  checked_on: 2026-10-05
  against: [s1, s2, s3, s4, s5]
headers:
  - id: power
    label: POWER
    type: socket
    rows: 1
    pins_per_row: 8
    pitch_mm: 2.54
    source: s5
    ref: "UNO-TH_Rev3e.brd, element POWER (8x1F-H8.5, package 1X08)"
    edges:
      - { edge: bottom, pins: 8, first: left, order: 1, source: s5, ref: "UNO-TH_Rev3e.brd, element POWER" }
  - id: analog
    label: AD
    type: socket
    rows: 1
    pins_per_row: 6
    pitch_mm: 2.54
    source: s5
    ref: "UNO-TH_Rev3e.brd, element AD (6x1F-H8.5, package 1X06)"
    edges:
      - { edge: bottom, pins: 6, first: left, order: 2, source: s5, ref: "UNO-TH_Rev3e.brd, element AD" }
  - id: digital-low
    label: IOL
    type: socket
    rows: 1
    pins_per_row: 8
    pitch_mm: 2.54
    source: s5
    ref: "UNO-TH_Rev3e.brd, element IOL (8x1F-H8.5, package 1X08)"
    edges:
      - { edge: top, pins: 8, first: right, order: 2, source: s5, ref: "UNO-TH_Rev3e.brd, element IOL" }
  - id: digital-high
    label: IOH
    type: socket
    rows: 1
    pins_per_row: 10
    pitch_mm: 2.54
    source: s5
    ref: "UNO-TH_Rev3e.brd, element IOH (10x1F-H8.5, package 1X10)"
    edges:
      - { edge: top, pins: 10, first: right, order: 1, source: s5, ref: "UNO-TH_Rev3e.brd, element IOH" }
  - id: icsp
    label: ICSP
    type: header
    rows: 2
    pins_per_row: 3
    pitch_mm: 2.54
    source: s5
    ref: "UNO-TH_Rev3e.brd, element ICSP (3x2 M, package 2X03)"
    edges:
      - { edge: inside, run: vertical, pins: 3, first: top, row1: left, source: s5, ref: "UNO-TH_Rev3e.brd, element ICSP" }
pins:
  - id: nc
    header: power
    row: 1
    index: 1
    label_aliases: ["NC"]
    direction: nc
    safe: avoid
    note: "Not connected."
    cites:
      - { source: s1, page: 11 }
      - { source: s2, page: 1 }
      - { source: s3, page: 1 }
  - id: ioref
    header: power
    row: 1
    index: 2
    label_aliases: ["IOREF"]
    direction: power
    voltage: 5
    safe: ok
    note: "Logic-level reference, connected to 5 V."
    cites:
      - { source: s1, page: 11 }
      - { source: s2, page: 1 }
      - { source: s3, page: 1 }
  - id: reset
    header: power
    row: 1
    index: 3
    chip_name: PC6
    label_aliases: ["RESET"]
    direction: in
    voltage: 5
    five_v_tolerant: true
    functions:
      - { type: reset }
    safe: caution
    note: "Pull low to reset the board."
    cites:
      - { source: s1, page: 11 }
      - { source: s2, page: 1 }
      - { source: s3, page: 1 }
      - { source: s4, page: 308 }
  - id: 3v3
    header: power
    row: 1
    index: 4
    label_aliases: ["+3V3", "3.3V"]
    direction: power
    voltage: 3.3
    safe: ok
    note: "Output of the board's 3.3 V regulator; at most 50 mA."
    cites:
      - { source: s1, page: 11 }
      - { source: s2, page: 1 }
      - { source: s3, page: 1 }
      - { source: s1, page: 8 }
  - id: 5v
